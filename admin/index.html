<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudX — Dashboard Admin</title>
<style>
  :root {
    --bg: #0b0b12;
    --card: #15151f;
    --border: #262635;
    --purple: #7c5cff;
    --text: #e8e8f0;
    --muted: #8b8b9e;
    --green: #3ddc84;
    --red: #ff5c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 40px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }
  h1 { font-size: 24px; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
  button {
    background: var(--purple);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card .label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .card .value {
    font-size: 28px;
    font-weight: 700;
  }
  .planos {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .planos h2 { font-size: 16px; margin-bottom: 16px; }
  .plano-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .plano-row:last-child { border-bottom: none; }
  .erro {
    color: var(--red);
    background: rgba(255,92,108,0.1);
    border: 1px solid var(--red);
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .loading { color: var(--muted); font-size: 14px; }
  footer {
    margin-top: 32px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Dashboard — CloudX</h1>
    <p class="subtitle" id="status">Carregando dados reais...</p>
  </div>
  <button onclick="carregarDados()">↻ Atualizar</button>
</header>

<div id="erroBox"></div>

<div class="grid" id="cards" style="display:none">
  <div class="card">
    <div class="label">Total de usuários</div>
    <div class="value" id="totalUsuarios">—</div>
  </div>
  <div class="card">
    <div class="label">Armazenamento usado</div>
    <div class="value" id="storageTotal">—</div>
  </div>
  <div class="card">
    <div class="label">Receita mensal estimada</div>
    <div class="value" id="receitaMensal">—</div>
  </div>
</div>

<div class="planos" id="planosBox" style="display:none">
  <h2>Usuários por plano</h2>
  <div id="planosLista"></div>
</div>

<footer id="atualizadoEm"></footer>

<script>
  // URL do seu próprio backend — já publicado no Vercel
  const API_URL = 'https://cloudx-backend.vercel.app/dashboard/stats';

  async function carregarDados() {
    const status = document.getElementById('status');
    const erroBox = document.getElementById('erroBox');
    const cards = document.getElementById('cards');
    const planosBox = document.getElementById('planosBox');

    status.textContent = 'Carregando dados reais...';
    erroBox.innerHTML = '';

    try {
      const res = await fetch(API_URL);
      const dados = await res.json();

      if (!dados.ok) throw new Error(dados.erro || 'Erro desconhecido');

      // Preenche os cards
      document.getElementById('totalUsuarios').textContent = dados.totalUsuarios;
      document.getElementById('storageTotal').textContent = dados.storageTotalUsadoGB + ' GB';
      document.getElementById('receitaMensal').textContent = 'R$ ' + dados.receitaMensalEstimada;

      // Preenche a lista de planos
      const planosLista = document.getElementById('planosLista');
      planosLista.innerHTML = '';
      const nomes = { free: 'Free', basico: 'Básico', pro: 'Pro', business: 'Business' };
      Object.entries(dados.porPlano).forEach(([plano, qtd]) => {
        const row = document.createElement('div');
        row.className = 'plano-row';
        row.innerHTML = `<span>${nomes[plano] || plano}</span><span>${qtd}</span>`;
        planosLista.appendChild(row);
      });

      cards.style.display = 'grid';
      planosBox.style.display = 'block';
      status.textContent = 'Dados atualizados';
      document.getElementById('atualizadoEm').textContent =
        'Última atualização: ' + new Date(dados.atualizadoEm).toLocaleString('pt-BR');

    } catch (e) {
      erroBox.innerHTML = `<div class="erro">❌ Erro ao carregar dados: ${e.message}</div>`;
      status.textContent = 'Falha ao carregar';
    }
  }

  // Carrega os dados assim que a página abre
  carregarDados();
</script>

</body>
</html>
